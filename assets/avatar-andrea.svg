<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Avatar ilustrado de Andrea Garcia">
  <title>Andrea Garcia</title>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a66"/>
      <stop offset="1" stop-color="#16232f"/>
    </linearGradient>
    <clipPath id="disco"><circle cx="80" cy="80" r="80"/></clipPath>
    <style>
      /* Animaciones declarativas: siguen corriendo aunque el SVG se use
         dentro de un &lt;img&gt;, que es como lo carga la aplicacion. */
      .flota { animation: flota 5.5s ease-in-out infinite; transform-origin: 80px 95px; }
      .parpadea { animation: parpadea 5.2s steps(1, end) infinite; transform-origin: center; }
      .brilla { animation: brilla 6s ease-in-out infinite; transform-origin: 80px 80px; }
      @keyframes flota { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3.5px) } }
      @keyframes parpadea { 0%,92%,100% { transform: scaleY(1) } 95% { transform: scaleY(.1) } }
      @keyframes brilla { 0%,100% { opacity:.16 } 50% { opacity:.36 } }
      @media (prefers-reduced-motion: reduce) {
        .flota, .parpadea, .brilla { animation: none }
      }
    </style>
  </defs>

  <g clip-path="url(#disco)">
    <circle cx="80" cy="80" r="80" fill="url(#fondo)"/>
    <circle class="brilla" cx="118" cy="34" r="46" fill="#fcda00" opacity=".22"/>

    <g class="flota">
      <!-- hombros -->
      <path d="M22 160c0-29 26-47 58-47s58 18 58 47z" fill="#fcda00"/>
      <path d="M62 112h36v16a18 18 0 0 1-36 0z" fill="#efd3b4"/>

      <!-- cabello, capa trasera -->
      <path d="M44 74c0-23 16-39 36-39s36 16 36 39v20c0 6-4 9-8 7V72H52v29c-4 2-8-1-8-7z" fill="#2b2118"/>

      <!-- rostro -->
      <path d="M52 62h56v30a28 28 0 0 1-56 0z" fill="#f6ddc0"/>
      <path d="M52 62h56v12H52z" fill="#2b2118"/>

      <!-- cejas y ojos -->
      <g fill="#2b2118">
        <rect x="63" y="80" width="12" height="2.6" rx="1.3"/>
        <rect x="85" y="80" width="12" height="2.6" rx="1.3"/>
        <ellipse class="parpadea" cx="69" cy="89" rx="3.4" ry="4"/>
        <ellipse class="parpadea" cx="91" cy="89" rx="3.4" ry="4"/>
      </g>
      <circle cx="59" cy="96" r="5" fill="#e8a893" opacity=".55"/>
      <circle cx="101" cy="96" r="5" fill="#e8a893" opacity=".55"/>
      <path d="M72 102a9 9 0 0 0 16 0" fill="none" stroke="#2b2118" stroke-width="2.6" stroke-linecap="round"/>

      <!-- diadema de audifonos -->
      <path d="M46 80a34 34 0 0 1 68 0" fill="none" stroke="#fcda00" stroke-width="7" stroke-linecap="round"/>
      <rect x="39" y="76" width="15" height="24" rx="7.5" fill="#fcda00"/>
      <rect x="106" y="76" width="15" height="24" rx="7.5" fill="#fcda00"/>
      <rect x="43" y="82" width="7" height="12" rx="3.5" fill="#16232f" opacity=".35"/>
      <rect x="110" y="82" width="7" height="12" rx="3.5" fill="#16232f" opacity=".35"/>

      <!-- microfono -->
      <path d="M117 98c0 12-10 18-19 18" fill="none" stroke="#fcda00" stroke-width="3.4" stroke-linecap="round"/>
      <circle cx="97" cy="116" r="3.6" fill="#fcda00"/>
    </g>
  </g>
</svg>
